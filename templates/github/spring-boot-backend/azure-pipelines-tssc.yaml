# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

name: azure-${{ values.repoName }}-tssc-pipeline

trigger:
- main

resources:
 repositories:
   - repository: ${{ values.repoName }} # Code Repository
     type: git
     name: "Developer Hub Demo/${{ values.repoName }}"
   - repository: ${{ values.repoName }}-gitops # Manifest Repository
     type: git
     name: "Developer Hub Demo/${{ values.repoName }}-gitops"



variables:
  - group: rhtap
  - name: CI_TYPE
    value: azure
  - name: GIT_SHA
    value: azure-$(Build.SourceVersion)
  - name: GIT_BRANCH
    value: $(Build.SourceBranchName)  
    
stages:
  - stage: CI
    displayName: CI Stage
    jobs:

       
      - job: compile
        displayName: compile 
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '11'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'package'
              
              
          - task: Docker@2
            displayName: Login to Quay
            inputs:
              containerRegistry: 'Quay Registry'
              command: 'login'

          - publish: $(System.DefaultWorkingDirectory)/target/${{ values.repoName }}-0.0.1-SNAPSHOT.jar
            artifact: target # Compiled file

      - job: build
        dependsOn: compile
        
        displayName: build 
        container:
           image: quay.io/redhat-appstudio/rhtap-task-runner:latest
           options: --privileged
           endpoint: 'Quay Registry'
        steps:           
          - checkout: self
          - download: current
            artifact: target #Download Compiled file
          - bash: |
                  echo "• init"
                  bash /work/rhtap/init.sh
            displayName: "Init RHTAP Components"       
            env:
              ROX_API_TOKEN: $(ROX_API_TOKEN)
              GITOPS_AUTH_PASSWORD: $(GITOPS_AUTH_PASSWORD)
              IMAGE_REGISTRY_USER: $(IMAGE_REGISTRY_USER)
              IMAGE_REGISTRY_PASSWORD: $(IMAGE_REGISTRY_PASSWORD)
              COSIGN_SECRET_PASSWORD: $(COSIGN_SECRET_PASSWORD)
              COSIGN_SECRET_KEY: $(COSIGN_SECRET_KEY)
              IMAGE_URL: "quay.io/redhat_na_ssa/${{ values.repoName }}"
              COSIGN_PUBLIC_KEY: $(COSIGN_PUBLIC_KEY)
          - bash: |
                echo $(COSIGN_LOG_LEVEL)          
                cp -rp $(Pipeline.Workspace)/target $(System.DefaultWorkingDirectory)/target
                echo "• buildah-rhtap"

                bash /work/rhtap/buildah-rhtap.sh

                echo "• cosign-sign-attest"
                cosign version 
                export COSIGN_LOG_LEVEL=debug
                bash /work/rhtap/cosign-sign-attest.sh

            displayName: "Build and Sign"     
            env:
              ROX_API_TOKEN: $(ROX_API_TOKEN)
              GITOPS_AUTH_PASSWORD: $(GITOPS_AUTH_PASSWORD)
              IMAGE_REGISTRY_USER: $(IMAGE_REGISTRY_USER)
              IMAGE_REGISTRY_PASSWORD: $(IMAGE_REGISTRY_PASSWORD)
              COSIGN_SECRET_PASSWORD: $(COSIGN_SECRET_PASSWORD)
              COSIGN_SECRET_KEY: $(COSIGN_SECRET_KEY)
              IMAGE_URL: "quay.io/redhat_na_ssa/${{ values.repoName }}"
              COSIGN_PUBLIC_KEY: $(COSIGN_PUBLIC_KEY)
              REKOR_HOST: $(REKOR_HOST)
              COSIGN_LOG_LEVEL: debug

          # - bash: |
          #       echo "• update-deployment"
          #       bash /work/rhtap/update-deployment.sh
          #   displayName: "Update Deployment"     
          #   env:
          #     ROX_API_TOKEN: $(ROX_API_TOKEN)
          #     GITOPS_AUTH_PASSWORD: $(GITOPS_AUTH_PASSWORD)
          #     IMAGE_REGISTRY_USER: $(IMAGE_REGISTRY_USER)
          #     IMAGE_REGISTRY_PASSWORD: $(IMAGE_REGISTRY_PASSWORD)
          #     COSIGN_SECRET_PASSWORD: $(COSIGN_SECRET_PASSWORD)
          #     COSIGN_SECRET_KEY: $(COSIGN_SECRET_KEY)
          #     IMAGE_URL: "quay.io/redhat_na_ssa/${{ values.repoName }}"

          - bash: |
                  roxctl -h
                  echo "• acs-deploy-check"
                  bash /work/rhtap/acs-deploy-check.sh
                  echo "• acs-image-check"
                  bash /work/rhtap/acs-image-check.sh
                  echo "• acs-image-scan"
                  bash /work/rhtap/acs-image-scan.sh
            displayName: "Image Scan and Checks"      
            env:
              ROX_API_TOKEN: $(ROX_API_TOKEN)
              GITOPS_AUTH_PASSWORD: $(GITOPS_AUTH_PASSWORD)
              IMAGE_REGISTRY_USER: $(IMAGE_REGISTRY_USER)
              IMAGE_REGISTRY_PASSWORD: $(IMAGE_REGISTRY_PASSWORD)
              COSIGN_SECRET_PASSWORD: $(COSIGN_SECRET_PASSWORD)
              COSIGN_SECRET_KEY: $(COSIGN_SECRET_KEY)
              IMAGE_URL: "quay.io/redhat_na_ssa/${{ values.repoName }}"      
          - bash: |
                  echo "• show-sbom-rhdh"
                  bash /work/rhtap/show-sbom-rhdh.sh
                  echo "• summary"
                  bash /work/rhtap/summary.sh
            displayName: "SBOM and Summarize"      
            env:
              ROX_API_TOKEN: $(ROX_API_TOKEN)
              GITOPS_AUTH_PASSWORD: $(GITOPS_AUTH_PASSWORD)
              IMAGE_REGISTRY_USER: $(IMAGE_REGISTRY_USER)
              IMAGE_REGISTRY_PASSWORD: $(IMAGE_REGISTRY_PASSWORD)
              COSIGN_SECRET_PASSWORD: $(COSIGN_SECRET_PASSWORD)
              COSIGN_SECRET_KEY: $(COSIGN_SECRET_KEY)
              IMAGE_URL: "quay.io/redhat_na_ssa/${{ values.repoName }}"

  - stage: CD
    displayName: Update the Gitops Repo
    jobs:
      - job: deploy
        displayName: Update Gitops Repo
        steps:
          - checkout: ${{ values.repoName }}-gitops
            displayName: Checkout Gitops Repository
            persistCredentials: true

          - task: Bash@3
            displayName: Update image SHA signature
            inputs:
              targetType: inline
              script: |
                   sed -e 's/\(.*tag:\) \(.*\)/\1 $(GIT_SHA)/g' ./helm/app/values.yaml > ./helm/app/values.yaml.temp
                   rm ./helm/app/values.yaml
                   mv ./helm/app/values.yaml.temp ./helm/app/values.yaml
          - task: Bash@3
            displayName: Configure Git
            inputs:
              targetType: inline
              script: |       
                  git config --local user.email "73549783+arunhari82@users.noreply.github.com"
                  git config --local user.name "arunhari82"

          - task: Bash@3
            displayName: Commit and Push Gitops
            inputs:
              targetType: inline
              script: |
                  git add ./helm/app/values.yaml    
                  git commit -m 'Updating Git Repo with image SHA : $(GIT_SHA)'
                  git push origin HEAD:main  
    

